/* --- Premium question UI --- */

.opt{
  background:#fff;
  color:#191919;
  border:1px solid #dedbd4;
  border-radius:16px;
  padding:16px 18px;
  text-align:left;
  font-size:16px;
  line-height:1.35;
  cursor:pointer;
  transition:all .18s ease;
}

.opt:hover{
  border-color:#191919;
  transform:translateY(-1px);
}

.opt.sel{
  background:#191919;
  color:#fff;
  border-color:#191919;
}

button:focus{
  outline:none;
}

button:focus-visible{
  outline:2px solid #b7aa98;
  outline-offset:3px;
}

/* Ranking */

.rank{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:15px 16px;
  margin:10px 0;
  background:#fff;
  border:1px solid #e5e0d8;
  border-radius:18px;
}

.rankLabel{
  flex:1;
  font-size:16px;
  line-height:1.35;
}

.rankBtns{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.rankNum{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #d8d2c8;
  background:#f6f3ee;
  color:#222;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:all .16s ease;
}

.rankNum:hover{
  border-color:#191919;
  transform:translateY(-1px);
}

.rankNum.sel{
  background:#191919;
  color:#fff;
  border-color:#191919;
}

@media(max-width:600px){
  .rank{
    align-items:flex-start;
    flex-direction:column;
  }

  .rankBtns{
    width:100%;
  }

  .rankNum{
    flex:1;
  }
}
  .loadingHero{
  text-align:center;
}

.loadingScene{
  position:relative;
  width:280px;
  height:190px;
  margin:35px auto 20px;
  background:#f5f1ea;
  border-radius:28px;
  overflow:hidden;
}

.loadingDesk{
  position:absolute;
  left:35px;
  right:35px;
  bottom:35px;
  height:10px;
  background:#242424;
  border-radius:10px;
}

.loadingCharacter{
  position:absolute;
  left:105px;
  bottom:58px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#ded7cc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  animation:reading 2.4s ease-in-out infinite;
}

.loadingPaper{
  position:absolute;
  left:155px;
  bottom:48px;
  width:55px;
  height:42px;
  background:#fff;
  border-radius:5px;
  transform:rotate(-8deg);
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.loadingPen{
  position:absolute;
  left:193px;
  bottom:65px;
  width:38px;
  height:5px;
  background:#242424;
  border-radius:5px;
  transform:rotate(-25deg);
  transform-origin:left center;
  animation:writing 1.2s ease-in-out infinite;
}

@keyframes reading{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(2deg)}
}

@keyframes writing{
  0%,100%{transform:rotate(-25deg) translateX(0)}
  50%{transform:rotate(-18deg) translateX(5px)}
}

.loadingTimer{
  font-size:34px;
  font-weight:700;
  letter-spacing:-1px;
  margin:8px 0 18px;
}

.loadingHero h3{
  margin-bottom:8px;
}
  /* ===== CAREER MAP ===== */

.careerMap{
  padding-bottom:80px;
}

.careerHero{
  padding:35px 0 50px;
  max-width:900px;
}

.careerHero h1{
  font-size:clamp(42px,7vw,76px);
  line-height:.98;
  letter-spacing:-3px;
  margin:12px 0 22px;
}

.careerSummary{
  font-size:22px;
  line-height:1.45;
  max-width:820px;
  color:#555;
}

.careerSection{
  margin-top:34px;
}

.careerSectionHeader{
  margin-bottom:20px;
}

.careerSectionHeader .tiny{
  margin-bottom:8px;
}

.careerSectionHeader h2{
  font-size:clamp(30px,4vw,46px);
  line-height:1.05;
  letter-spacing:-1.5px;
  margin:0;
}

.careerIntroCard{
  padding:34px;
  margin-bottom:20px;
}

.careerIntroCard h3{
  margin-top:0;
  font-size:24px;
}

.careerIntroCard p{
  font-size:18px;
  line-height:1.65;
}

.dnaLayout{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);
  gap:20px;
  align-items:stretch;
}

.dnaVisual{
  min-height:560px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:25px;
}

.dnaVisual svg{
  width:100%;
  height:auto;
  max-width:760px;
}

.dnaLegend{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:28px;
}

.dnaItem{
  padding-bottom:13px;
  border-bottom:1px solid #ebe8e2;
}

.dnaItem:last-child{
  border-bottom:0;
}

.dnaItemTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:7px;
}

.dnaItemName{
  font-weight:700;
  overflow-wrap:anywhere;
}

.dnaScore{
  font-weight:700;
  color:#777;
  flex-shrink:0;
}

.dnaTrack{
  height:7px;
  background:#e7e3dc;
  border-radius:99px;
  overflow:hidden;
}

.dnaTrack i{
  display:block;
  height:100%;
  background:#171717;
  border-radius:99px;
}

.dnaItem p{
  margin:7px 0 0;
  color:#666;
  font-size:14px;
  line-height:1.45;
}

.profileGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.profileCard{
  padding:30px;
  min-width:0;
}

.profileCard h3,
.directionCard h3,
.revealCard h3{
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.08;
  margin-top:0;
}

.profileCard h3{
  font-size:25px;
  margin-bottom:14px;
}

.profileCard .summary{
  font-size:18px;
  line-height:1.5;
  margin-bottom:18px;
}

.profileCard .detail,
.directionCard .detail,
.revealCard .detail{
  color:#666;
  line-height:1.7;
  font-size:16px;
}

.revealList{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.revealCard{
  padding:34px;
  border-radius:22px;
}

.revealNumber{
  font-size:13px;
  letter-spacing:2px;
  color:#888;
  margin-bottom:12px;
}

.revealCard h3{
  font-size:30px;
  margin-bottom:16px;
}

.revealObservation{
  font-size:19px;
  line-height:1.5;
  margin-bottom:18px;
}

.directionGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.directionCard{
  padding:30px;
  min-width:0;
}

.directionCard h3{
  font-size:26px;
  margin-bottom:12px;
}

.directionSummary{
  font-size:18px;
  line-height:1.5;
  margin-bottom:20px;
}

.directionBlock{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #ebe8e2;
}

.directionBlock strong{
  display:block;
  margin-bottom:7px;
}

.nextGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.nextCard{
  padding:28px;
}

.nextCard h3{
  margin-top:0;
  font-size:22px;
  overflow-wrap:anywhere;
}

.nextCard p{
  color:#666;
  line-height:1.65;
}

.environmentCard{
  padding:34px;
}

.environmentCard h3{
  margin-top:0;
  font-size:30px;
}

.environmentCard p{
  font-size:18px;
  line-height:1.7;
  color:#5f5f5f;
}

.careerCTA{
  margin-top:34px;
  padding:36px;
  text-align:center;
}

.careerCTA h2{
  margin-top:0;
}

/* responsive */

@media(max-width:800px){
  .dnaLayout,
  .profileGrid,
  .directionGrid,
  .nextGrid{
    grid-template-columns:1fr;
  }

  .dnaVisual{
    min-height:430px;
    padding:12px;
  }

  .careerHero{
    padding-top:20px;
  }

  .careerHero h1{

  .careerSummary{

  }

  .careerIntroCard,
  .profileCard,
  .directionCard,
  .revealCard,

  }
}

let s={phase:'intro',i:0,a:{},follow:[],fi:0,profile:null,chat:[]};
try{
  if(new URLSearchParams(location.search).get('reset')==='1'){
    localStorage.removeItem('doroCD');

  }

}catch{}
const save=()=>{try{localStorage.setItem('doroCD',JSON.stringify(s))}catch{}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function intro(){app.innerHTML=`<div class="hero"><div class="tiny">DORO · CAREER DISCOVERY</div><h1>Find your direction.</h1><p class="muted">100 Fragen zu Interessen, Arbeitsweise, Menschen, Kreativität, Karriere, Lebensstil und echten Trade-offs. Danach folgt ein persönlicher Deep Dive und eine intensive Career Map.</p><div class="chips"><span>100 Fragen</span><span>Rankings</span><span>Zurück</span><span>AI Deep Dive</span></div><p><button class="btn" onclick="start()">Journey starten</button></p><p><button class="btn alt" onclick="resetTestData()">Testdaten löschen & neu starten</button></p></div>`}
function start(){s={phase:'quiz',i:0,a:{},follow:[],fi:0,profile:null,chat:[]};save();render()}
function render(){({intro,quiz,second,analysis:analyze,final,chat})[s.phase]()}
function quiz(){let q=Q[s.i],a=s.a[q.id],body=q.type==='rank'?q.options.map((o,n)=>`<div class="rank"><span class="rankLabel">${esc(o)}</span><div class="rankBtns">${[1,2,3,4].map(v=>`<button class="rankNum ${a?.[n]==v?'sel':''}" onclick="setRank(${n},${v})">${v}</button>`).join('')}</div></div>`).join(''):q.options.map((o,n)=>`<button class="opt ${a===n?'sel':''}" onclick="pick(${n})">${esc(o)}</button>`).join('');
app.innerHTML=`<div class="row"><span class="tiny">FRAGE ${s.i+1} / ${Q.length}</span><span class="muted">${Math.round(s.i/Q.length*100)}%</span></div><div class="bar"><i style="width:${s.i/Q.length*100}%"></i></div><div class="card"><h2 class="q">${esc(q.question)}</h2>${body}<div class="row" style="margin-top:22px"><button class="btn alt" onclick="back()" ${s.i?'':'disabled'}>← Zurück</button><button class="btn" onclick="${q.type==='rank'?'rankNext()':'next()'}">${s.i===Q.length-1?'Analyse starten':'Weiter →'}</button></div></div>`}
function pick(n){s.a[Q[s.i].id]=n;next()}
function setRank(opt,rank){let q=Q[s.i],v=Array.isArray(s.a[q.id])?[...s.a[q.id]]:['','','',''],other=v.indexOf(String(rank));if(other>=0&&other!==opt)v[other]='';v[opt]=String(rank);s.a[q.id]=v;save();render()}
function rankNext(){let v=s.a[Q[s.i].id]||[];if(v.length!==4||v.some(x=>!x)||new Set(v).size<4)return alert('Bitte 1–4 jeweils genau einmal vergeben.');next()}
function next(){if(s.i<Q.length-1){s.i++;save();render()}else analyze()}
function back(){if(s.i){s.i--;render()}}
async function analyze(){

  s.phase='analysis';

  const startTime=Date.now();

  app.innerHTML=`
    <div class="hero loadingHero">
      <div class="tiny">DEIN PROFIL ENTSTEHT</div>

      <h1>Wir lesen zwischen den Antworten.</h1>

      <div class="loadingScene">
        <div class="loadingCharacter">◡̈</div>
        <div class="loadingDesk"></div>
        <div class="loadingPaper"></div>
        <div class="loadingPen"></div>
      </div>

      <div class="loadingTimer" id="loadingTimer">00:00</div>

      <h3 id="loadingTitle">Dein Profil nimmt Form an.</h3>

      <p class="muted" id="loadingText">
        Deine Antworten werden zu einem Gesamtbild verbunden.
      </p>
    </div>
  `;

  const loadingMessages=[
    ['Dein Profil nimmt Form an.','Deine Antworten werden zu einem Gesamtbild verbunden.'],
    ['Wir schauen genauer hin.','Besonders interessante Kombinationen werden herausgearbeitet.'],
    ['Muster werden verbunden.','Was passt zusammen – und was überraschend nicht?'],
    ['Deine Interessen bekommen Struktur.','Aus vielen einzelnen Antworten entsteht langsam ein klares Bild.'],
    ['Wir sind fast durch.','Die spannendsten Punkte werden für deinen Deep Dive vorbereitet.']
  ];

  let msgIndex=0;

  const timerInterval=setInterval(()=>{
    const seconds=Math.floor((Date.now()-startTime)/1000);
    const min=String(Math.floor(seconds/60)).padStart(2,'0');
    const sec=String(seconds%60).padStart(2,'0');

    const timer=document.getElementById('loadingTimer');

    if(timer){
      timer.textContent=`${min}:${sec}`;
    }
  },1000);

  const messageInterval=setInterval(()=>{
    msgIndex=(msgIndex+1)%loadingMessages.length;

    const title=document.getElementById('loadingTitle');
    const text=document.getElementById('loadingText');

    if(title){
      title.textContent=loadingMessages[msgIndex][0];
    }

    if(text){
      text.textContent=loadingMessages[msgIndex][1];
    }
  },4000);

  try{

    const r=await fetch('/api/analyze',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        questions:Q,
        answers:s.a
      })
    });

    if(!r.ok){
      throw Error(await r.text());
    }

    const result=await r.json();

    clearInterval(timerInterval);
    clearInterval(messageInterval);

    s.profile=result;
    s.follow=result.followup_questions||[];
    s.fi=0;
    s.phase='second';

    save();
    render();

  }catch(e){

    clearInterval(timerInterval);
    clearInterval(messageInterval);

    app.innerHTML=`
      <div class="card">
        <h2>Dein Profil konnte gerade nicht erstellt werden.</h2>

        <p class="muted">
          Deine Antworten sind gespeichert.
          Bitte versuche es noch einmal.
        </p>

        <p>${esc(e.message)}</p>
      </div>
    `;
  }
}
function second(){if(!s.follow.length)return finalize();let q=s.follow[s.fi];app.innerHTML=`<div class="tiny">DEEP DIVE · ${s.fi+1} / ${s.follow.length}</div><div class="bar"><i style="width:${s.fi/s.follow.length*100}%"></i></div><div class="card"><h2 class="q">${esc(q.question)}</h2>${q.options.map((o,n)=>`<button class="opt" onclick="fpick(${n})">${esc(o)}</button>`).join('')}<button class="btn alt" onclick="fback()" style="margin-top:18px">← Zurück</button></div>`}
function fpick(n){s.a['f'+s.follow[s.fi].id]=n;if(s.fi<s.follow.length-1){s.fi++;save();render()}else finalize()}
function fback(){if(s.fi){s.fi--;render()}else{s.phase='quiz';s.i=Q.length-1;render()}}
async function finalize(){s.phase='analysis';app.innerHTML='<div class="hero"><div class="tiny">CAREER MAP</div><h1>Jetzt wird das Gesamtbild erstellt.</h1><p class="muted">Erst- und Zweitfragebogen werden gemeinsam interpretiert.</p></div>';try{let r=await fetch('/api/finalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questions:Q,answers:s.a,profile:s.profile,followup:s.follow})});if(!r.ok)throw Error(await r.text());s.profile=await r.json();s.phase='final';save();render()}catch(e){app.innerHTML=`<div class="card"><h2>Analysefehler</h2><p>${esc(e.message)}</p></div>`}}
function final(){let p=s.profile||{};app.innerHTML=`<div class="tiny">YOUR CAREER MAP</div><h1>${esc(p.headline||'Dein Profil')}</h1><p class="muted">${esc(p.summary||'')}</p><div class="grid section">${(p.themes||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.description)}</p></div>`).join('')}</div><div class="card section"><h2>Richtungen zum Erkunden</h2>${(p.directions||[]).map(x=>`<div style="padding:13px 0;border-bottom:1px solid #eee"><b>${esc(x.title)}</b><p class="muted">${esc(x.why)}</p><small>${esc(x.test)}</small></div>`).join('')}</div><div class="card section"><h2>Spannungen & offene Fragen</h2>${(p.tensions||[]).map(x=>`<p><b>${esc(x.title)}</b><br><span class="muted">${esc(x.detail)}</span></p>`).join('')}</div><div class="card section"><h2>Nächste Schritte</h2><ol>${(p.next_steps||[]).map(x=>`<li style="margin:9px 0">${esc(x)}</li>`).join('')}</ol><button class="btn" onclick="s.phase='chat';render()">Mit dem Career Advisor sprechen →</button></div>`}
async function chat(){app.innerHTML=`<div class="row"><div><div class="tiny">AI CAREER ADVISOR</div><h1 style="font-size:38px">Lass uns tiefer gehen.</h1></div><button class="btn alt" onclick="s.phase='final';render()">Career Map</button></div><div class="card chat">${s.chat.map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${esc(m.text)}</div>`).join('')||'<div class="muted">Frag mich zu deinem Profil, möglichen Richtungen oder nächsten Experimenten.</div>'}</div><div class="chatbox"><input id="msg" placeholder="z. B. Welche Richtung sollte ich als Erstes testen?"><button class="btn" onclick="send()">Senden</button></div>`}
async function send(){let i=document.getElementById('msg'),t=i.value.trim();if(!t)return;s.chat.push({role:'user',text:t});render();try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,profile:s.profile,answers:s.a,history:s.chat})});let d=await r.json();s.chat.push({role:'assistant',text:d.text||d.error});save();render()}catch(e){s.chat.push({role:'assistant',text:'Die KI ist momentan nicht erreichbar.'});render()}}
render();
