/* --- Premium question UI --- */

.opt{
  background:#fff;
  color:#191919;
  border:1px solid #dedbd4;
  border-radius:16px;
  padding:16px 18px;
  text-align:left;
  font-size:16px;
  line-height:1.35;
  cursor:pointer;
  transition:all .18s ease;
}

.opt:hover{
  border-color:#191919;
  transform:translateY(-1px);
}

.opt.sel{
  background:#191919;
  color:#fff;
  border-color:#191919;
}

button:focus{
  outline:none;
}

button:focus-visible{
  outline:2px solid #b7aa98;
  outline-offset:3px;
}

/* Ranking */

.rank{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  padding:15px 16px;
  margin:10px 0;
  background:#fff;
  border:1px solid #e5e0d8;
  border-radius:18px;
}

.rankLabel{
  flex:1;
  font-size:16px;
  line-height:1.35;
}

.rankBtns{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.rankNum{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid #d8d2c8;
  background:#f6f3ee;
  color:#222;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:all .16s ease;
}

.rankNum:hover{
  border-color:#191919;
  transform:translateY(-1px);
}

.rankNum.sel{
  background:#191919;
  color:#fff;
  border-color:#191919;
}

@media(max-width:600px){
  .rank{
    align-items:flex-start;
    flex-direction:column;
  }

  .rankBtns{
    width:100%;
  }

  .rankNum{
    flex:1;
  }
}
  .loadingHero{
  text-align:center;
}

.loadingScene{
  position:relative;
  width:280px;
  height:190px;
  margin:35px auto 20px;
  background:#f5f1ea;
  border-radius:28px;
  overflow:hidden;
}

.loadingDesk{
  position:absolute;
  left:35px;
  right:35px;
  bottom:35px;
  height:10px;
  background:#242424;
  border-radius:10px;
}

.loadingCharacter{
  position:absolute;
  left:105px;
  bottom:58px;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#ded7cc;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  animation:reading 2.4s ease-in-out infinite;
}

.loadingPaper{
  position:absolute;
  left:155px;
  bottom:48px;
  width:55px;
  height:42px;
  background:#fff;
  border-radius:5px;
  transform:rotate(-8deg);
  box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.loadingPen{
  position:absolute;
  left:193px;
  bottom:65px;
  width:38px;
  height:5px;
  background:#242424;
  border-radius:5px;
  transform:rotate(-25deg);
  transform-origin:left center;
  animation:writing 1.2s ease-in-out infinite;
}

@keyframes reading{
  0%,100%{transform:translateY(0) rotate(-2deg)}
  50%{transform:translateY(-5px) rotate(2deg)}
}

@keyframes writing{
  0%,100%{transform:rotate(-25deg) translateX(0)}
  50%{transform:rotate(-18deg) translateX(5px)}
}

.loadingTimer{
  font-size:34px;
  font-weight:700;
  letter-spacing:-1px;
  margin:8px 0 18px;
}

.loadingHero h3{
  margin-bottom:8px;
}
  /* ===== CAREER MAP ===== */

.careerMap{
  padding-bottom:80px;
}

.careerHero{
  padding:35px 0 50px;
  max-width:900px;
}

.careerHero h1{
  font-size:clamp(42px,7vw,76px);
  line-height:.98;
  letter-spacing:-3px;
  margin:12px 0 22px;
}

.careerSummary{
  font-size:22px;
  line-height:1.45;
  max-width:820px;
  color:#555;
}

.careerSection{
  margin-top:34px;
}

.careerSectionHeader{
  margin-bottom:20px;
}

.careerSectionHeader .tiny{
  margin-bottom:8px;
}

.careerSectionHeader h2{
  font-size:clamp(30px,4vw,46px);
  line-height:1.05;
  letter-spacing:-1.5px;
  margin:0;
}

.careerIntroCard{
  padding:34px;
  margin-bottom:20px;
}

.careerIntroCard h3{
  margin-top:0;
  font-size:24px;
}

.careerIntroCard p{
  font-size:18px;
  line-height:1.65;
}

.dnaLayout{
  display:flex;
  flex-direction:column;
  gap:28px;
  align-items:center;
}

.dnaVisual{
  width:100%;
  max-width:720px;
  min-height:auto;
  padding:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}

.radarSvg{
  width:100%;
  max-width:560px;
  height:auto;
  display:block;
  overflow:visible;
  margin:0 auto;
}

.dnaVisual{
  min-height:560px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:25px;
}

.dnaVisual svg{
  width:100%;
  height:auto;
  max-width:760px;
}

.dnaLegend{
  display:flex;
  flex-direction:column;
  gap:14px;
  padding:28px;
}

.dnaItem{
  padding-bottom:13px;
  border-bottom:1px solid #ebe8e2;
}

.dnaItem:last-child{
  border-bottom:0;
}

.dnaItemTop{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:7px;
}

.dnaItemName{
  font-weight:700;
  overflow-wrap:anywhere;
}

.dnaScore{
  font-weight:700;
  color:#777;
  flex-shrink:0;
}

.dnaTrack{
  height:7px;
  background:#e7e3dc;
  border-radius:99px;
  overflow:hidden;
}

.dnaTrack i{
  display:block;
  height:100%;
  background:#171717;
  border-radius:99px;
}

.dnaItem p{
  margin:7px 0 0;
  color:#666;
  font-size:14px;
  line-height:1.45;
}

.profileGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.profileCard{
  padding:30px;
  min-width:0;
}

.profileCard h3,
.directionCard h3,
.revealCard h3{
  overflow-wrap:anywhere;
  word-break:normal;
  line-height:1.08;
  margin-top:0;
}

.profileCard h3{
  font-size:25px;
  margin-bottom:14px;
}

.profileCard .summary{
  font-size:18px;
  line-height:1.5;
  margin-bottom:18px;
}

.profileCard .detail,
.directionCard .detail,
.revealCard .detail{
  color:#666;
  line-height:1.7;
  font-size:16px;
}

.revealList{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.revealCard{
  padding:34px;
  border-radius:22px;
}

.revealNumber{
  font-size:13px;
  letter-spacing:2px;
  color:#888;
  margin-bottom:12px;
}

.revealCard h3{
  font-size:30px;
  margin-bottom:16px;
}

.revealObservation{
  font-size:19px;
  line-height:1.5;
  margin-bottom:18px;
}

.directionGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.directionCard{
  padding:30px;
  min-width:0;
}

.directionCard h3{
  font-size:26px;
  margin-bottom:12px;
}

.directionSummary{
  font-size:18px;
  line-height:1.5;
  margin-bottom:20px;
}

.directionBlock{
  margin-top:20px;
  padding-top:18px;
  border-top:1px solid #ebe8e2;
}

.directionBlock strong{
  display:block;
  margin-bottom:7px;
}

.nextGrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:20px;
}

.nextCard{
  padding:28px;
}

.nextCard h3{
  margin-top:0;
  font-size:22px;
  overflow-wrap:anywhere;
}

.nextCard p{
  color:#666;
  line-height:1.65;
}

.environmentCard{
  padding:34px;
}

.environmentCard h3{
  margin-top:0;
  font-size:30px;
}

.environmentCard p{
  font-size:18px;
  line-height:1.7;
  color:#5f5f5f;
}

.careerCTA{
  margin-top:34px;
  padding:36px;
  text-align:center;
}

.careerCTA h2{
  margin-top:0;
}

/* responsive */

@media(max-width:800px){
  .dnaLayout,
  .profileGrid,
  .directionGrid,
  .nextGrid{
    grid-template-columns:1fr;
  }

  .dnaVisual{
    min-height:430px;
    padding:12px;
  }

  .careerHero{
    padding-top:20px;
  }

  .careerHero h1{
    letter-spacing:-2px;
  }

  .careerSummary{
    font-size:19px;
  }

  .careerIntroCard,
  .profileCard,
  .directionCard,
  .revealCard,
  .nextCard,
  .environmentCard{
    padding:24px;
  }
}

    <section class="careerSection dnaSection"><div class="careerSectionHeader"><div class="tiny">DEIN PROFIL AUF EINEN BLICK</div><h2>Career DNA</h2><p class="sectionLead">Nicht ein einzelner Beruf beschreibt dich. Spannender ist die Kombination deiner stärksten Muster.</p></div><div class="dnaLayout2"><div class="card dnaVisual2">${radar()}<div class="radarCaption"><b>${esc(dna.title||profile.title||'Dein Profil')}</b><span>${esc(dna.description||'')}</span></div></div><div class="dnaLegend2">${dimensions.map(d=>`<article class="dnaItem2"><div class="dnaItemTop"><span>${esc(d.name||'')}</span><b>${Math.round(clamp(d.score))}</b></div><div class="dnaTrack"><i style="width:${clamp(d.score)}%"></i></div><p>${esc(d.summary||d.short_description||'')}</p></article>`).join('')}</div></div></section>
    ${axes.length?`<section class="careerSection"><div class="careerSectionHeader"><div class="tiny">DIE SPANNUNGEN DAZWISCHEN</div><h2>Du bist nicht nur eine Skala</h2><p class="sectionLead">Diese Achsen zeigen, wie sich verschiedene Seiten deines Profils zueinander verhalten.</p></div><div class="axisGrid">${axisBars()}</div></section>`:''}
    <section class="careerSection"><div class="careerSectionHeader"><div class="tiny">DAS GESAMTBILD</div><h2>Was hinter dem Profil steckt</h2></div><div class="profileIntroGrid"><div class="card introStatement"><div class="tiny">IN EINEM SATZ</div><h3>${esc(profile.title||dna.title||'Dein Profil')}</h3><p>${esc(profile.summary||'')}</p></div><div class="card introDetail"><div class="tiny">ETWAS GENAUER</div><p>${esc(profile.description||dna.description||'')}</p></div></div></section>
    ${strengths.length?`<section class="careerSection"><div class="careerSectionHeader"><div class="tiny">PERSÖNLICHE MUSTER</div><h2>Was dich ausmacht</h2></div><div class="profileGrid2 gridCentered">${strengths.map((x,i)=>`<article class="card profileCard2"><div class="cardIndex">0${i+1}</div><h3>${esc(x.title||'')}</h3><div class="summary">${esc(x.summary||'')}</div><p>${esc(x.description||'')}</p></article>`).join('')}</div></section>`:''}
    ${reveals.length?`<section class="careerSection revealSection"><div class="careerSectionHeader"><div class="tiny">INTERESSANTE SPANNUNGEN</div><h2>Du hast dich gerade selbst verraten.</h2><p class="sectionLead">Die interessantesten Stellen sind oft nicht die offensichtlichsten – sondern die kleinen Widersprüche.</p></div><div class="revealGrid gridCentered">${reveals.map((x,i)=>`<article class="card revealCard2"><div class="revealNumber">${String(i+1).padStart(2,'0')}</div><h3>${esc(x.title||'')}</h3><div class="revealObservation">${esc(x.observation||'')}</div><p>${esc(x.interpretation||'')}</p></article>`).join('')}</div></section>`:''}
    ${directions.length?`<section class="careerSection"><div class="careerSectionHeader"><div class="tiny">MÖGLICHE FELDER</div><h2>Richtungen zum Erkunden</h2><p class="sectionLead">Keine endgültigen Antworten. Eher berufliche Welten, in denen du deine Interessen ausprobieren kannst.</p></div><div class="directionGrid2 gridCentered">${directions.map((x,i)=>`<article class="card directionCard2"><div class="directionTag">0${i+1}</div><h3>${esc(x.title||'')}</h3><div class="directionSummary">${esc(x.summary||'')}</div><p>${esc(x.description||'')}</p><div class="directionSplit">${x.why_it_fits?`<div><b>Warum interessant</b><p>${esc(x.why_it_fits)}</p></div>`:''}${x.watch_out?`<div><b>Genauer hinschauen</b><p>${esc(x.watch_out)}</p></div>`:''}</div></article>`).join('')}</div></section>`:''}
    ${environment.environment_title?`<section class="careerSection"><div class="careerSectionHeader"><div class="tiny">ARBEITSUMFELD</div><h2>Wo dein Profil Raum bekommen könnte</h2></div><div class="environmentGrid"><div class="card environmentMain"><div class="tiny">MÖGLICHE ARBEITSWELT</div><h3>${esc(environment.environment_title)}</h3><p>${esc(environment.environment_summary||'')}</p></div><div class="card environmentDetail"><p>${esc(environment.environment_description||'')}</p></div></div></section>`:''}
    ${nextSteps.length?`<section class="careerSection"><div class="careerSectionHeader"><div class="tiny">ORIENTIERUNG</div><h2>Wie du jetzt weitersuchen kannst</h2></div><div class="nextGrid2 gridCentered">${nextSteps.map((x,i)=>`<article class="card nextCard2"><div class="cardIndex">0${i+1}</div><h3>${esc(typeof x==='string'?x:(x.title||''))}</h3>${typeof x==='object'&&x.description?`<p>${esc(x.description)}</p>`:''}</article>`).join('')}</div></section>`:''}
    ${jobCards()}
    <section class="card careerCTA"><div class="tiny">UND JETZT?</div><h2>Du musst dich noch nicht festlegen.</h2><p class="muted">Die nächste sinnvolle Frage ist nicht „Welchen Beruf mache ich?“, sondern „Welche dieser Welten möchte ich als Nächstes wirklich kennenlernen?“</p><button class="btn" onclick="s.phase='chat';render()">Mit dem Career Advisor sprechen →</button></section>
  </div>`;
  if(s.jobsJobId&&!s.jobsPollingPaused&&!jobsPollingActive)setTimeout(()=>resumeJobsPolling(),80);
}
function canonicalJobUrl(value){return JobFlow.canonicalUrl(value)}
function jobIdentity(j){const k=JobFlow.identityKeys(j);return `${k.url}|${k.tuple}`}
function isSavedJob(j){return savedJobs.some(x=>jobIdentity(x)===jobIdentity(j))}
function jobCardMarkup(j){
  const saved=isSavedJob(j),encoded=encodeURIComponent(jobIdentity(j));
  const checked=j.checked_at?new Date(j.checked_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
  return `<article class="card jobCard"><button class="saveJobBtn" onclick="toggleSavedJob('${encoded}')" aria-label="${saved?'Aus Merkliste entfernen':'Stelle merken'}" aria-pressed="${saved}">${saved?'♥':'♡'}</button><div class="jobMeta"><span>${esc(j.location)}</span><span>${esc(j.type)}</span></div><h3>${esc(j.title)}</h3><div class="jobCompany">${esc(j.company)}</div><p>${esc(j.description)}</p><div class="jobWhy"><b>Warum passt das zu dir?</b><p>${esc(j.why_fit)}</p></div><div class="jobActions"><a class="btn jobBtn" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">Zur Ausschreibung ↗</a><button class="btn alt" onclick="openMotivation('${encoded}')">Motivationsschreiben</button><span class="jobSource">Quelle: ${esc(j.source)}${checked?` · Geprüft am ${checked}`:''}</span></div></article>`;
}
function findJob(identity){return [...(s.jobs||[]),...savedJobs].find(j=>jobIdentity(j)===decodeURIComponent(identity))}
function toggleSavedJob(identity){
  const key=decodeURIComponent(identity),index=savedJobs.findIndex(j=>jobIdentity(j)===key);
  if(index>=0)savedJobs.splice(index,1);else{const job=findJob(identity);if(job)savedJobs.push({...job,savedAt:new Date().toISOString()})}
  saveSavedJobs();render();
}
function showSavedJobs(){
  s.phase='saved';save();updateSavedCount();
  app.innerHTML=`<div class="savedPage"><div class="savedHeader"><div><div class="tiny">DEINE MERKLISTE</div><h1>Gespeicherte Stellen</h1><p class="muted">Diese vollständigen Jobdaten bleiben unabhängig von deinem Test und einem Neustart gespeichert.</p></div><button class="btn alt" onclick="returnFromSaved()">${s.profile?'Zur Career Map':'Zurück'} →</button></div>${savedJobs.length?`<div class="jobsGrid gridCentered">${savedJobs.map(jobCardMarkup).join('')}</div>`:`<div class="card emptySaved"><h2>Noch keine Stellen gemerkt.</h2><p class="muted">Mit dem Herz an einer Live-Stelle kannst du sie hier dauerhaft ablegen.</p></div>`}</div>`;
}
function returnFromSaved(){s.phase=s.profile?'final':'intro';save();render()}
function openMotivation(identity){const job=findJob(identity);if(!job)return;s.motivationJob=job;s.motivationReturn=s.phase;s.motivationText='';s.motivationNote='';s.phase='motivation';save();render()}
function motivationPage(){
  const j=s.motivationJob||{};
  app.innerHTML=`<div class="motivationPage"><button class="btn alt" onclick="backFromMotivation()">← Zurück</button><div class="tiny" style="margin-top:28px">BEWERBUNG VORBEREITEN</div><h1>${esc(j.title||'Motivationsschreiben')}</h1><div class="jobCompany">${esc(j.company)}</div><div class="motivationGrid"><div class="card motivationSide"><div class="tiny">DIE STELLE</div><p>${esc(j.description)}</p><div class="jobWhy"><b>Warum passt das zu dir?</b><p>${esc(j.why_fit)}</p></div><div class="tiny" style="margin-top:24px">DEIN PERSÖNLICHER INPUT</div><textarea id="motivationNote" class="motivationText" style="min-height:150px" placeholder="Was reizt dich persönlich an dieser Stelle?">${esc(s.motivationNote||'')}</textarea><button class="btn" style="margin-top:10px" onclick="generateMotivation()">Motivationsschreiben erstellen →</button></div><div class="card motivationSide"><div class="tiny">DEIN ENTWURF</div>${s.motivationLoading?`<div class="motivationLoading">Dein Schreiben wird individuell formuliert…</div>`:`<textarea id="motivationText" class="motivationText" placeholder="Hier erscheint dein Entwurf.">${esc(s.motivationText||'')}</textarea><div class="motivationTools"><button class="btn alt" onclick="copyMotivation()">Text kopieren</button></div>`}</div></div></div>`;
}
function backFromMotivation(){s.phase=s.motivationReturn==='saved'?'saved':(s.profile?'final':'intro');save();render()}
async function copyMotivation(){const text=document.getElementById('motivationText')?.value||'';if(!text)return;try{await navigator.clipboard.writeText(text)}catch{prompt('Text kopieren:',text)}}
async function generateMotivation(){
  if(s.motivationLoading)return;const j=s.motivationJob,note=(document.getElementById('motivationNote')?.value||'').trim();s.motivationNote=note;s.motivationLoading=true;save();render();
  const message=`Erstelle ein glaubwürdiges deutsches Motivationsschreiben (250–350 Wörter) für ${j.title} bei ${j.company}. Erfinde keine Erfahrungen. Nutze Career Map und Antworten. Stelle: ${j.description}. Profilbezug: ${j.why_fit}. Persönlicher Hinweis: ${note||'Keiner'}. Keine Meta-Erklärung.`;
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,profile:s.profile,answers:s.a,history:[]})});const d=await r.json();if(!r.ok)throw Error(d.error);s.motivationText=d.text||''}catch(e){s.motivationText='Das Schreiben konnte gerade nicht erstellt werden. Bitte versuche es erneut.'}s.motivationLoading=false;save();render();
}
let jobsPollingActive=false;
async function loadJobs(append=false){
  if(s.jobsLoading||s.jobsJobId)return;
  s.jobsLoading=true;s.jobsError='';s.jobsNotice='';s.jobsAppend=append;s.jobsRound=1;s.jobsPending=[];s.jobsFlowId=(globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`);
  s.jobsRequestId=(globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`);save();
  try{
    const exclude=[...(s.jobs||[]),...savedJobs].map(j=>({url:j.url,company:j.company,title:j.title,location:j.location}));
    jobDiagnostic('searchStarted',{existingJobsCount:(s.jobs||[]).length,excludeCount:exclude.length});
    const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:s.profile,exclude,append,searchRound:1,diagnosticFlowId:s.jobsFlowId,existingJobsCount:(s.jobs||[]).length,searchRequestId:s.jobsRequestId})});
    const data=await r.json();
    if(!r.ok||!data.jobId)throw Error('temporarily_unavailable');
    s.jobsJobId=data.jobId;s.jobsSearchVersion=JOBS_SEARCH_VERSION;save();
    await resumeJobsPolling();
  }catch(e){finishJobsError(e.message)}
}
async function resumeJobsPolling(){
  if(!s.jobsJobId||jobsPollingActive)return;
  jobsPollingActive=true;
  s.jobsPollingPaused=false;s.jobsLoading=true;s.jobsNotice='';save();render();
  try{
    const pollingResult=await JobFlow.pollBackgroundJob({
      fetchStatus:async()=>{
      const r=await fetch('/api/jobs-status?jobId='+encodeURIComponent(s.jobsJobId)+'&searchRound='+encodeURIComponent(s.jobsRound||1)+'&diagnosticFlowId='+encodeURIComponent(s.jobsFlowId||''),{cache:'no-store'});
      const data=await r.json();
      if(!r.ok)throw Error('temporarily_unavailable');
      return data;
      }
    });
    if(pollingResult.outcome==='complete'){
      const received=Array.isArray(pollingResult.result?.jobs)?pollingResult.result.jobs:[];
      jobDiagnostic('frontend_result_received',{jobId:s.jobsJobId,jobsReceivedByFrontend:received.length,searchRound:s.jobsRound||1});
      return finishJobsRound(received);
    }
    jobDiagnostic('polling_stopped',{pollCount:pollingResult.pollCount,openAIStatus:pollingResult.lastStatus,pollingOutcome:pollingResult.outcome});
    if(pollingResult.outcome==='terminal_error')return finishJobsError(false);
    return pauseJobsPolling();
  }catch(e){
    jobDiagnostic('polling_stopped',{openAIStatus:'unknown',pollingOutcome:'unexpected_error'});
    return pauseJobsPolling();
  }finally{
    jobsPollingActive=false;
    if(!s.jobsJobId)s.jobsLoading=false;
    save();render();
  }
}
async function finishJobsRound(incoming){
  const round=s.jobsRound||1;
  if(!s.jobsAppend)return finishJobsSuccess(incoming);
  const previousPending=s.jobsPending||[],baseline=JobFlow.dedupeJobs([...(s.jobs||[]),...savedJobs]);
  const merged=JobFlow.appendJobs(baseline,[...previousPending,...incoming]);
  const pending=merged.jobs.slice(baseline.length),newThisRound=pending.length-previousPending.length;
  jobDiagnostic(`round${round}Result`,{[`round${round}Candidates`]:incoming.length,[`round${round}Verified`]:incoming.length,[`round${round}NewAfterDedup`]:newThisRound,round2Started:round===2?'true':'false'});
  if(round===1&&pending.length<6){
    s.jobsPending=pending;s.jobsRound=2;s.jobsJobId=null;
    const exclude=[...(s.jobs||[]),...savedJobs,...pending].map(j=>({url:j.url,company:j.company,title:j.title,location:j.location}));
    jobDiagnostic('round2Started',{existingJobsCount:(s.jobs||[]).length,excludeCount:exclude.length,round2Started:'true'});
    const requestId=`${s.jobsRequestId||Date.now()}-round-2`;
    const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:s.profile,exclude,append:true,searchRound:2,diagnosticFlowId:s.jobsFlowId,existingJobsCount:(s.jobs||[]).length,searchRequestId:requestId})});
    const data=await r.json();if(!r.ok||!data.jobId)throw Error('temporarily_unavailable');
    s.jobsJobId=data.jobId;s.jobsSearchVersion=JOBS_SEARCH_VERSION;save();
    setTimeout(()=>resumeJobsPolling(),0);return;
  }
  return finishJobsSuccess(pending);
}
function pauseJobsPolling(){
  if(!s.jobsJobId)return;
  s.jobsLoading=false;s.jobsPollingPaused=true;s.jobsNotice='Die Suche dauert länger als erwartet.';save();render();
}
function retryJobsPolling(){
  if(!s.jobsJobId)return;
  s.jobsPollingPaused=false;s.jobsLoading=true;save();render();
  return resumeJobsPolling();
}
function finishJobsSuccess(incoming){
  const existing=Array.isArray(s.jobs)?s.jobs:[],append=s.jobsAppend,completedRound=s.jobsRound||1;
  const merged=append?JobFlow.appendJobs(existing,incoming):{jobs:JobFlow.dedupeJobs(incoming),added:JobFlow.dedupeJobs(incoming).length,duplicatesRemoved:incoming.length-JobFlow.dedupeJobs(incoming).length};
  const freshCount=merged.added;
  s.jobs=merged.jobs;s.jobsLoaded=true;s.jobsLoading=false;s.jobsJobId=null;s.jobsSearchVersion=null;s.jobsPollingPaused=false;s.jobsAppend=false;s.jobsRound=1;s.jobsPending=[];s.jobsRequestId=null;
  s.jobsError='';s.jobsNotice=freshCount===0?(append?'Diesmal konnten keine weiteren verifizierten Stellen gefunden werden.':'Diesmal konnten keine verifizierten Stellen gefunden werden.'):'';
  jobDiagnostic('append_completed',{duplicatesRemoved:merged.duplicatesRemoved,rejectedUrlDuplicate:merged.rejectedUrlDuplicate||0,rejectedTupleDuplicate:merged.rejectedTupleDuplicate||0,rejectedInvalidShape:merged.rejectedInvalidShape||0,newJobsReturned:incoming.length,jobsBeforeFrontendDeduplication:existing.length+incoming.length,jobsAfterFrontendDeduplication:merged.jobs.length,existingJobsBeforeAppend:existing.length,newJobsAppended:freshCount,totalNewJobs:freshCount,totalJobsAfterAppend:s.jobs.length,round2Started:(append&&completedRound===2)?'true':'false'});
  if(!s.jobs.length)s.jobsError='Bitte starte eine neue Live-Suche. Es werden keine statischen oder ungeprüften Ersatztreffer angezeigt.';
  save();render();
}
function jobDiagnostic(stage,metrics){fetch('/api/jobs-diagnostics',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({flowId:s.jobsFlowId,stage,...metrics}),keepalive:true}).catch(()=>{})}
function finishJobsError(){const hadJobs=(s.jobs||[]).length>0;s.jobsError=hadJobs?'Weitere Stellen konnten gerade nicht geladen werden.':'Die Live-Suche ist gerade ausgelastet. Bitte versuche es in einem Moment erneut.';s.jobsNotice=s.jobsError;s.jobsLoading=false;s.jobsLoaded=true;s.jobsJobId=null;s.jobsSearchVersion=null;s.jobsPollingPaused=false;s.jobsAppend=false;s.jobsRequestId=null;save();render()}
function loadMoreJobs(){return loadJobs(true)}

function chat(){
  app.innerHTML=`<div class="advisorPage"><div class="row"><div><div class="tiny">CAREER ADVISOR</div><h1 style="font-size:clamp(36px,7vw,56px);margin:8px 0">Lass uns tiefer gehen.</h1><p class="muted">Du kannst hier alles aus deinem Report weiterdenken – auch Dinge, die noch gar nicht klar sind.</p></div><button class="btn alt" onclick="s.phase='final';render()">Career Map</button></div><div class="card chat">${s.chat.map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${esc(m.text)}</div>`).join('')||'<div class="advisorEmpty"><div class="advisorIcon">✦</div><div><b>Womit möchtest du anfangen?</b><p class="muted">Zum Beispiel: „Ich will auch Richtung Kunst.“</p></div></div>'}${s.chatLoading?`<div class="bubble ai typingBubble"><span class="typingDots"><i></i><i></i><i></i></span><span>Ich schaue gerade in dein Profil…</span></div>`:''}</div><div class="chatbox"><input id="msg" autocomplete="off" placeholder="z. B. Welche Richtung sollte ich zuerst testen?"><button class="btn" onclick="send()" ${s.chatLoading?'disabled':''}>Senden</button></div></div>`;
  if(s.chatLoading)window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
async function send(){
  const i=document.getElementById('msg'),t=i.value.trim();if(!t||s.chatLoading)return;
  s.chat.push({role:'user',text:t});s.chatLoading=true;save();render();
  try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      message:t,
      profile:s.profile,
      answers:s.a,
      questions:Q,
      followup:s.follow,
      history:s.chat
    })});const d=await r.json();s.chat.push({role:'assistant',text:d.text||d.error||'Der Career Advisor konnte gerade nicht antworten.'});}
  catch(e){s.chat.push({role:'assistant',text:'Der Career Advisor ist momentan nicht erreichbar.'});}
  s.chatLoading=false;save();render();
}
render();
</script></body></html>
