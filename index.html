function render(){({intro,quiz,second,analysis:analyze,final,chat})[s.phase]()}
function quiz(){let q=Q[s.i],a=s.a[q.id],body=q.type==='rank'?q.options.map((o,n)=>`<div class="rank"><span>${esc(o)}</span><select id="r${n}"><option value="">Rang…</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>`).join(''):q.options.map((o,n)=>`<button class="opt ${a===n?'sel':''}" onclick="pick(${n})">${esc(o)}</button>`).join('');
app.innerHTML=`<div class="row"><span class="tiny">FRAGE ${s.i+1} / ${Q.length}</span><span class="muted">${Math.round(s.i/Q.length*100)}%</span></div><div class="bar"><i style="width:${s.i/Q.length*100}%"></i></div><div class="card"><h2 class="q">${esc(q.question)}</h2>${body}<div class="row" style="margin-top:22px"><button class="btn alt" onclick="back()" ${s.i?'':'disabled'}>← Zurück</button><button class="btn" onclick="${q.type==='rank'?'rankNext()':'next()'}">${s.i===Q.length-1?'Analyse starten':'Weiter →'}</button></div></div>`}
function pick(n){s.a[Q[s.i].id]=n;next()}
function rankNext(){let v=[0,1,2,3].map(n=>document.getElementById('r'+n).value);if(v.some(x=>!x)||new Set(v).size<4)return alert('Bitte 1–4 jeweils genau einmal vergeben.');s.a[Q[s.i].id]=v;next()}
function next(){if(s.i<Q.length-1){s.i++;save();render()}else analyze()}
function back(){if(s.i){s.i--;render()}}
async function analyze(){s.phase='analysis';app.innerHTML='<div class="hero"><div class="tiny">ANALYSE</div><h1>Wir lesen zwischen den Antworten.</h1><p class="muted">Die KI sucht nach Mustern, Widersprüchen und interessanten Kombinationen und baut daraus deinen zweiten Fragebogen.</p></div>';try{let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questions:Q,answers:s.a})});if(!r.ok)throw Error(await r.text());let d=await r.json();s.profile=d;s.follow=d.followup_questions||[];s.fi=0;s.phase='second';save();render()}catch(e){app.innerHTML=`<div class="card"><h2>KI noch nicht verbunden</h2><p class="muted">Der Test ist vollständig. Setze auf dem Hosting OPENAI_API_KEY, damit die Analyse läuft.</p><p>${esc(e.message)}</p></div>`}}
function second(){if(!s.follow.length)return finalize();let q=s.follow[s.fi];app.innerHTML=`<div class="tiny">DEEP DIVE · ${s.fi+1} / ${s.follow.length}</div><div class="bar"><i style="width:${s.fi/s.follow.length*100}%"></i></div><div class="card"><h2 class="q">${esc(q.question)}</h2>${q.options.map((o,n)=>`<button class="opt" onclick="fpick(${n})">${esc(o)}</button>`).join('')}<button class="btn alt" onclick="fback()" style="margin-top:18px">← Zurück</button></div>`}
function fpick(n){s.a['f'+s.follow[s.fi].id]=n;if(s.fi<s.follow.length-1){s.fi++;save();render()}else finalize()}
function fback(){if(s.fi){s.fi--;render()}else{s.phase='quiz';s.i=Q.length-1;render()}}
async function finalize(){s.phase='analysis';app.innerHTML='<div class="hero"><div class="tiny">CAREER MAP</div><h1>Jetzt wird das Gesamtbild erstellt.</h1><p class="muted">Erst- und Zweitfragebogen werden gemeinsam interpretiert.</p></div>';try{let r=await fetch('/api/finalize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questions:Q,answers:s.a,profile:s.profile,followup:s.follow})});if(!r.ok)throw Error(await r.text());s.profile=await r.json();s.phase='final';save();render()}catch(e){app.innerHTML=`<div class="card"><h2>Analysefehler</h2><p>${esc(e.message)}</p></div>`}}
function final(){let p=s.profile||{};app.innerHTML=`<div class="tiny">YOUR CAREER MAP</div><h1>${esc(p.headline||'Dein Profil')}</h1><p class="muted">${esc(p.summary||'')}</p><div class="grid section">${(p.themes||[]).map(x=>`<div class="card"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.description)}</p></div>`).join('')}</div><div class="card section"><h2>Richtungen zum Erkunden</h2>${(p.directions||[]).map(x=>`<div style="padding:13px 0;border-bottom:1px solid #eee"><b>${esc(x.title)}</b><p class="muted">${esc(x.why)}</p><small>${esc(x.test)}</small></div>`).join('')}</div><div class="card section"><h2>Spannungen & offene Fragen</h2>${(p.tensions||[]).map(x=>`<p><b>${esc(x.title)}</b><br><span class="muted">${esc(x.detail)}</span></p>`).join('')}</div><div class="card section"><h2>Nächste Schritte</h2><ol>${(p.next_steps||[]).map(x=>`<li style="margin:9px 0">${esc(x)}</li>`).join('')}</ol><button class="btn" onclick="s.phase='chat';render()">Mit dem Career Advisor sprechen →</button></div>`}
async function chat(){app.innerHTML=`<div class="row"><div><div class="tiny">AI CAREER ADVISOR</div><h1 style="font-size:38px">Lass uns tiefer gehen.</h1></div><button class="btn alt" onclick="s.phase='final';render()">Career Map</button></div><div class="card chat">${s.chat.map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${esc(m.text)}</div>`).join('')||'<div class="muted">Frag mich zu deinem Profil, möglichen Richtungen oder nächsten Experimenten.</div>'}</div><div class="chatbox"><input id="msg" placeholder="z. B. Welche Richtung sollte ich als Erstes testen?"><button class="btn" onclick="send()">Senden</button></div>`}
async function send(){let i=document.getElementById('msg'),t=i.value.trim();if(!t)return;s.chat.push({role:'user',text:t});render();try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t,profile:s.profile,answers:s.a,history:s.chat})});let d=await r.json();s.chat.push({role:'assistant',text:d.text||d.error});save();render()}catch(e){s.chat.push({role:'assistant',text:'Die KI ist momentan nicht erreichbar.'});render()}}
render();
</script></body></html>
